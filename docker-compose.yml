version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bramble-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bramble_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bramble_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bramble-spring-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bramble_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: BrambleSecretKeyForProductionSigningJwtTokensMustBeAtLeast256Bits
    ports:
      - "8080:8080"

volumes:
  postgres_data:
